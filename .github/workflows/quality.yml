name: Shared quality

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/audio_capture/lib packages/audio_capture/test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Verify audio capture package
        working-directory: packages/audio_capture
        run: |
          flutter pub get
          flutter analyze
          flutter test
