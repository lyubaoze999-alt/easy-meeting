name: Platform builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: build/app/outputs/flutter-apk/*release*.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify bounded PCM frame pump
        run: |
          swiftc \
            packages/audio_capture/macos/audio_capture/Sources/audio_capture/PCMFramePump.swift \
            packages/audio_capture/macos/audio_capture/Tests/PCMFramePumpTests/main.swift \
            -o /tmp/pcm_frame_pump_tests
          /tmp/pcm_frame_pump_tests
      - run: flutter build macos --release
      - run: bash packaging/macos/create_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-unsigned
          path: build/releases/*.dmg

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: build/ios/archive/*.xcarchive

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        id: windows_build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-release-build.log"
          cmd /c "flutter --no-color build windows --release > `"$log`" 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content $log
          exit $buildExit
      - name: Summarize Windows build failure
        if: ${{ failure() && steps.windows_build.outcome == 'failure' }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-release-build.log"
          "## Windows release build failed" >> $env:GITHUB_STEP_SUMMARY
          "The final 300 log lines are shown below; the complete log is attached to this run." >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          Get-Content $log -Tail 300 |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' >> $env:GITHUB_STEP_SUMMARY

          Get-Content $log |
            Select-String -Pattern 'fatal error|error C[0-9]+|error LNK[0-9]+|CMake Error' |
            Select-Object -Last 20 |
            ForEach-Object {
              $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows build::$message"
            }
      - name: Upload Windows build diagnostics
        if: ${{ failure() && steps.windows_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-release-build.log
          if-no-files-found: error
          retention-days: 14
      - shell: powershell
        run: ./packaging/windows/build_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-unsigned
          path: build/releases/*.msix
